name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Types and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm run test:unit

      # Blocking, and strict: the script refuses warnings too. The baseline of
      # react-hooks and unused-variable findings has been paid down.
      - name: Lint
        run: pnpm run lint

  # Merge gate: the pull_request trigger above is the only path this job
  # takes; on a push to main the publish gate in deploy.yml gates the same
  # reusable workflow instead, so the suite never runs twice for a commit.
  e2e:
    name: E2E gate
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/e2e.yml
