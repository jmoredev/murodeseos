name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Types and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm run test:unit

      # Not blocking yet: the repository has a pre-existing baseline of
      # react-hooks and unused-variable findings. Reported here so the debt
      # stays visible until it is paid down.
      - name: Lint
        run: pnpm run lint
        continue-on-error: true

      # The end-to-end suite needs Docker for `supabase start`, which GitHub
      # runners do not provide. It stays a local gate for now.
