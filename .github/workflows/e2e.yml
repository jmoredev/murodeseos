# Reusable end-to-end workflow. It is called by `.github/workflows/ci.yml`
# (the pull request merge gate) and by `.github/workflows/deploy.yml` (the
# publish gate) so both gates run the identical suite.
name: End-to-end

on:
  workflow_call:

# Read-only so a caller with wider permissions (deploy.yml publishes with
# `pages: write` and `id-token: write`) cannot widen this job.
permissions:
  contents: read

jobs:
  chromium:
    name: Chromium suite
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Browsers are not installed by `pnpm install`; --with-deps supplies the
      # shared libraries the runner is missing.
      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Start Supabase local stack
        run: pnpm exec supabase start

      - name: Generate .env.local from Supabase stack
        # Supabase CLI 2.117.0 supports `-o env` and prints the three keys we
        # need as KEY="value" lines. Its notices go to stderr, and the anchored
        # patterns below keep every other stdout line (LINKED_*, JWT_SECRET, ...)
        # out of the file. The names are chosen deliberately:
        # lib/supabase.ts needs EXPO_PUBLIC_SUPABASE_URL / ..._ANON_KEY, and
        # scripts/seed-complete-database.ts reads only
        # SUPABASE_SERVICE_ROLE_KEY. Leave NEXT_SERVICE_ROLE_KEY and
        # EXPO_SERVICE_ROLE_KEY unset so they cannot shadow the real key in
        # the specs' fallback chain.
        run: |
          pnpm exec supabase status -o env | grep -E '^(API_URL|ANON_KEY|SERVICE_ROLE_KEY)=' \
            | sed -e 's/^API_URL=/EXPO_PUBLIC_SUPABASE_URL=/' \
                  -e 's/^ANON_KEY=/EXPO_PUBLIC_SUPABASE_ANON_KEY=/' \
                  -e 's/^SERVICE_ROLE_KEY=/SUPABASE_SERVICE_ROLE_KEY=/' \
            > .env.local

      - name: Seed and run E2E (chromium only)
        # GitHub Actions already exports CI=true, which selects the gate
        # branch of playwright.config.ts (workers 1, retries 2,
        # reuseExistingServer false, forbidOnly true). Do not set CI again.
        # The suite must never run without prepare first: the seeded fixture
        # is expected, and the suite is not self-cleaning (open defect E-10
        # leaves test groups behind if it runs against a stale database).
        run: pnpm run test:e2e:prepare && pnpm exec playwright test --project=chromium

      # Playwright cleans playwright-report/ and test-results/ at the start of
      # every run, so each project's artifacts are uploaded immediately after
      # its own step. The HTML reporter (enabled in CI) writes playwright-report/;
      # failure screenshots and on-first-retry traces land in test-results/.
      - name: Upload Chromium failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-chromium
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn

      - name: Seed and run E2E (Mobile Chrome only)
        # Re-seed before Mobile Chrome: defect E-10 means the suite is not
        # self-cleaning, so a second project against the same seed would see
        # the groups the first run left behind. `test:e2e:prepare` restarts
        # Supabase and re-seeds, giving Mobile Chrome a fresh fixture. Mobile
        # Chrome uses the Chromium engine installed above, so no extra
        # `playwright install` is needed. Mobile Safari runs bounded to the
        # mobile specs below; Firefox remains deliberately out of CI (see
        # docs/DEVELOPMENT.md).
        run: pnpm run test:e2e:prepare && pnpm exec playwright test --project="Mobile Chrome"

      - name: Upload Mobile Chrome failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-mobile-chrome
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn

      # WebKit is a separate engine: it is the only CI approximation of iOS
      # Safari, which no other project in this workflow exercises.
      # `if: always()` is deliberate: if Mobile Chrome turns red, skipping the
      # WebKit steps would drop the ONLY iOS signal of the whole gate, while
      # running them anyway costs a few extra CI minutes on an already-red
      # job. Each step re-seeds (`test:e2e:prepare`), the iOS run never sees
      # a stale fixture from the failed previous run.
      - name: Install WebKit for Playwright
        if: always()
        run: pnpm exec playwright install --with-deps webkit

      - name: Seed and run E2E (Mobile Safari, bounded to the mobile specs)
        if: always()
        # Same rationale as the Mobile Chrome step: defect E-10 means the suite
        # is not self-cleaning, so this project needs its own `test:e2e:prepare`
        # re-seed on top of the fresh fixture the scheduler left behind. The run
        # is bounded to e2e/mobile-layout.spec.ts and
        # e2e/responsive-wishlist.spec.ts to keep the extra engine's cost down
        # while still deciding what only Mobile Safari can decide: iOS Safari
        # viewport/keyboard/safe-area behaviour (exactly the checks the
        # mobile-layout spec contains: focus zoom and touch tap targets; the
        # safe-area layout itself is fixed by units A–E and proven there). The
        # full WebKit desktop suite stays out of CI on cost grounds.
        run: pnpm run test:e2e:prepare && pnpm exec playwright test --project="Mobile Safari" e2e/mobile-layout.spec.ts e2e/responsive-wishlist.spec.ts

      - name: Upload Mobile Safari failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-mobile-safari
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
