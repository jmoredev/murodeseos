name: Deploy to GitHub Pages

on:
  # Publishing is deliberate: it happens when a release tag is pushed, not on every merge.
  # `main` is where work lands and a tag is the record of what was actually published,
  # which is what used to be impossible to look up.
  push:
    tags: ['v*']
  # Kept for re-publishing or rolling back without moving a tag.
  workflow_dispatch:

# Publishing is the only thing this workflow may do beyond reading the repository.
permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deployment in flight: a half-published site is worse than a slow one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify-release:
    name: Verify the tag is on main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # A tag can point at any commit. Publishing only from `main` keeps the published
      # bundle equal to what the pull requests and the gate went through, which is the
      # whole point of publishing less often.
      - name: Check the tag is an ancestor of main
        run: |
          git fetch --quiet origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  build:
    name: Build the static export
    needs: [verify-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # lib/supabase.ts refuses to load without these, and the published bundle
      # must point at the production project, so they are build-time inputs.
      # EXPO_PUBLIC_SITE_URL is what confirmation e-mails use to send the user
      # back to the site instead of to a local server.
      - name: Build
        run: pnpm run build
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_SITE_URL: ${{ vars.EXPO_PUBLIC_SITE_URL }}

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # Publish gate: the identical chromium suite called via the reusable
  # workflow, so a red suite leaves the previously published version in
  # place — that is the intent.
  e2e:
    name: E2E gate
    uses: ./.github/workflows/e2e.yml

  deploy:
    name: Publish
    needs: [build, e2e]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
